name: Tagpr
on:
  push:
    branches:
      - main

jobs:
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Fetch GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          app-id: ${{ secrets.GH_APP_TAGPR_ID }}
          private-key: ${{ secrets.GH_APP_TAGPR_PKEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Tagpr
        id: tagpr
        uses: tapihdev/actionshub/Songmu/tagpr@c6c445d4204e1a272c7e2cdbcfb06d490ecf9f9f # main
        with:
          github-token: ${{ steps.token.outputs.token }}

      - name: Annotate major and minor tags
        if: steps.tagpr.outputs.tag != ''
        uses: tapihdev/tag-major-minor-semver@7b86820b4c4e796f6703c551c55ff8f42e165e3a # v1.0.5
        with:
          tag: ${{ steps.tagpr.outputs.tag }}
